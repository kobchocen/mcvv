replicaCount: 2
image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
migration:
  enabled: true
  repository: ""
  digest: ""
  # DB_MIGRATE_TIMEOUT_SECONDS for scripts/db-migrate.ts (prisma migrate deploy).
  timeoutSeconds: 900
  # Job deadline; must exceed timeoutSeconds (prod MySQL B1ms is slow).
  activeDeadlineSeconds: 1200
imagePullSecrets: []
environment: prod
databaseSecret: mcvv-database
stagingSecret: mcvv-staging
caSecret: ""
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
service:
  port: 80
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
