name: Verify application

on:
  pull_request:
  push:
    branches-ignore: [main, develop, "release/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable the pinned package manager
        run: npm install --global corepack@0.34.0 && corepack enable
      - name: Install dependencies and generate Prisma Client
        run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check Conventional Commits on the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check Helm chart
        run: pnpm chart:check
      - name: Verify Docker images, MySQL TLS and persistence
        run: pnpm test:integration
