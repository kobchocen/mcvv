<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <!-- Zdroj výchozího banneru newsletteru (public/images/newsletter/banner-2026.png). Vykreslit v Chrome/Playwright: viewport 1200×400, deviceScaleFactor 1, pak PNG s paletou (sharp: palette, quality 92). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 400px;
        overflow: hidden;
      }
      .b {
        position: relative;
        width: 1200px;
        height: 400px;
        background: #0f2a1c;
        color: #fff;
        font-family: Inter, Arial, sans-serif;
        overflow: hidden;
      }
      .photo {
        position: absolute;
        inset: 0;
        background: url(../../public/images/hero-trat-mlha.jpg) center 55% / cover no-repeat;
        filter: saturate(0.8);
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(15, 42, 28, 0.97) 0%,
          rgba(15, 42, 28, 0.9) 46%,
          rgba(15, 42, 28, 0.45) 75%,
          rgba(15, 42, 28, 0.2) 100%
        );
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: #e2531c;
      }
      .c {
        position: absolute;
        left: 64px;
        top: 48px;
        right: 360px;
      }
      .kicker {
        display: inline-block;
        font:
          600 22px/1 Oswald,
          sans-serif;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #0f2a1c;
        background: #e2531c;
        padding: 8px 14px 7px;
      }
      .kicker b {
        color: #fff;
        font-weight: 700;
      }
      h1 {
        margin-top: 18px;
        font:
          700 68px/0.98 Oswald,
          sans-serif;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .meta {
        margin-top: 22px;
        display: flex;
        gap: 28px;
        font:
          600 25px/1.2 Inter,
          sans-serif;
        color: #e8efe9;
      }
      .meta span {
        white-space: nowrap;
      }
      .meta i {
        font-style: normal;
        color: #e2531c;
        margin-right: 8px;
      }
      .cta {
        position: absolute;
        right: 56px;
        bottom: 50px;
        text-align: right;
      }
      .cta .btn {
        display: inline-block;
        font:
          700 26px/1 Oswald,
          sans-serif;
        letter-spacing: 1px;
        text-transform: uppercase;
        background: #e2531c;
        color: #fff;
        padding: 16px 24px 15px;
      }
      .cta .note {
        margin-top: 10px;
        font:
          500 19px/1.3 Inter,
          sans-serif;
        color: #f2f6f1;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
      }
      .date {
        position: absolute;
        right: 56px;
        top: 44px;
        text-align: right;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
      }
      .date .d {
        font:
          700 92px/0.9 Oswald,
          sans-serif;
      }
      .date .w {
        font:
          600 24px/1.2 Oswald,
          sans-serif;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #f2f6f1;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="b">
      <div class="photo"></div>
      <div class="shade"></div>
      <div class="c">
        <div class="kicker"><b>34.</b> ročník · Choceň</div>
        <h1>Malá cena<br />Velké Verandy</h1>
        <div class="meta">
          <span><i>●</i>Choceň – Velká Veranda</span><span><i>●</i>4,3 km lesního krosu</span>
        </div>
      </div>
      <div class="date">
        <div class="d">6. 12.</div>
        <div class="w">neděle 2026</div>
      </div>
      <div class="cta">
        <div class="btn">Přihlas se na mcvv.org</div>
        <div class="note">Přihlášky online do 2. 12. 2026</div>
      </div>
      <div class="bar"></div>
    </div>
  </body>
</html>
