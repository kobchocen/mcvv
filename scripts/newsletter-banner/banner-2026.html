<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <!-- Zdroj výchozího banneru newsletteru (public/images/newsletter/banner-2026.png). Vykreslit v Chrome/Playwright: viewport 1200×400, deviceScaleFactor 1, pak PNG s paletou (sharp: palette, quality 92).
         Texty jsou předsložené (NFC) a rovnou verzálkami; Oswald i Inter se načítají i v podmnožině latin-ext (Ř, Ě, Ň, Č…).
         Výška řádku nadpisu (1.5) musí nechat kolem diakritiky jasnou mezeru: při menší line-height než ~1.3 sahá vysoká čárka nad É z druhého řádku až k účaří prvního a pod mezerou za MALÁ vypadá jako čárka („MALÁ, CENA“). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&subset=latin,latin-ext&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 400px;
        overflow: hidden;
      }
      .b {
        position: relative;
        width: 1200px;
        height: 400px;
        background: #0f2a1c;
        color: #fff;
        font-family: Inter, Arial, sans-serif;
        overflow: hidden;
      }
      .photo {
        position: absolute;
        inset: 0;
        background: url(../../public/images/hero-trat-mlha.jpg) center 55% / cover no-repeat;
        filter: saturate(0.8);
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(15, 42, 28, 0.97) 0%,
          rgba(15, 42, 28, 0.9) 46%,
          rgba(15, 42, 28, 0.45) 75%,
          rgba(15, 42, 28, 0.2) 100%
        );
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: #e2531c;
      }
      .c {
        position: absolute;
        left: 64px;
        top: 38px;
        right: 360px;
      }
      .kicker {
        display: inline-block;
        font:
          600 22px/1.3 Oswald,
          sans-serif;
        letter-spacing: 3px;
        color: #0f2a1c;
        background: #e2531c;
        padding: 5px 14px 4px;
      }
      .kicker b {
        color: #fff;
        font-weight: 700;
      }
      h1 {
        margin-top: 4px;
        font:
          700 56px/1.5 Oswald,
          sans-serif;
        letter-spacing: 0.5px;
      }
      .meta {
        margin-top: 8px;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font:
          600 22px/1.3 Inter,
          sans-serif;
        color: #e8efe9;
      }
      .meta li {
        white-space: nowrap;
      }
      .meta li::before {
        content: "●";
        color: #e2531c;
        margin-right: 10px;
        font-size: 16px;
        vertical-align: 2px;
      }
      .cta {
        position: absolute;
        right: 56px;
        bottom: 50px;
        text-align: right;
      }
      .cta .btn {
        display: inline-block;
        font:
          700 26px/1.25 Oswald,
          sans-serif;
        letter-spacing: 1px;
        background: #e2531c;
        color: #fff;
        padding: 13px 24px 12px;
      }
      .cta .note {
        margin-top: 10px;
        font:
          500 19px/1.3 Inter,
          sans-serif;
        color: #f2f6f1;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
      }
      .date {
        position: absolute;
        right: 56px;
        top: 44px;
        text-align: right;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
      }
      .date .d {
        font:
          700 92px/0.9 Oswald,
          sans-serif;
      }
      .date .w {
        font:
          600 24px/1.2 Oswald,
          sans-serif;
        letter-spacing: 3px;
        color: #f2f6f1;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="b">
      <div class="photo"></div>
      <div class="shade"></div>
      <div class="c">
        <div class="kicker"><b>34.</b> ROČNÍK · CHOCEŇ</div>
        <h1>MALÁ CENA<br />VELKÉ VERANDY</h1>
        <ul class="meta">
          <li>Choceň – Velká Veranda</li>
          <li>4 300 m</li>
          <li>lesní kros</li>
        </ul>
      </div>
      <div class="date">
        <div class="d">6. 12.</div>
        <div class="w">NEDĚLE 2026</div>
      </div>
      <div class="cta">
        <div class="btn">PŘIHLAS SE NA MCVV.ORG</div>
        <div class="note">Přihlášky online do 2. 12. 2026</div>
      </div>
      <div class="bar"></div>
    </div>
  </body>
</html>
