# Install as .github/workflows/deploy-azure.yml in kobchocen/mcvv (both branches).
name: Request Azure deployment
on:
  push:
    branches: [main, develop]
permissions: {}
jobs:
  dispatch:
    if: github.repository == 'kobchocen/mcvv' && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
      INFRA_REPOSITORY: ${{ vars.INFRA_REPOSITORY }}
      APPLICATION_BRANCH: ${{ github.ref_name }}
      APPLICATION_SHA: ${{ github.sha }}
    steps:
      - name: Dispatch the application commit to infrastructure
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INFRA_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ -n "$GH_TOKEN" ]]
          case "$APPLICATION_BRANCH" in
            main) workflow=deploy-production.yml ;;
            develop) workflow=deploy-staging.yml ;;
            *) exit 1 ;;
          esac
          gh workflow run "$workflow" --repo "$INFRA_REPOSITORY" --ref main \
            -f mode=deploy -f "application_sha=$APPLICATION_SHA"
          printf 'Deployment requested for `%s`. Completion and logs: https://github.com/%s/actions/workflows/%s\n' \
            "$APPLICATION_SHA" "$INFRA_REPOSITORY" "$workflow" >> "$GITHUB_STEP_SUMMARY"
