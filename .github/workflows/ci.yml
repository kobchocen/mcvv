name: Verify application

on:
  pull_request:
  push:
    branches-ignore: [main, develop, "release/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Enable the pinned package manager
        run: npm install --global corepack@0.34.0 && corepack enable
      - name: Install dependencies and generate Prisma Client
        run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check Conventional Commits on the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check Helm chart
        run: pnpm chart:check
      - name: Verify Docker images, MySQL TLS and persistence
        run: pnpm test:integration
